name: Validate Repositories Catalog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and Build Catalog
        run: |
          node build.js
          git diff --exit-code index.json || (echo "Warning: index.json was not updated. Please run 'node build.js'." && exit 1)
